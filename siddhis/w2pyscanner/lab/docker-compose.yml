version: '3.8'

services:
  w2pyscanner-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w2pyscanner-test-app
    ports:
      - "8086:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - WEB2PY_PASSWORD=admin123
      - WEB2PY_ADMIN_EMAIL=admin@example.com
    volumes:
      - ./web2py_app.py:/app/web2py_app.py
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 