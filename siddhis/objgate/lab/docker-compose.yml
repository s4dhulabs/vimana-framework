services:
  objgate-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: objgate-test-app
    ports:
      - "18105:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
