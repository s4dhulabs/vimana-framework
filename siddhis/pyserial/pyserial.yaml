    ⠞⠓⠊⠎:⠞⠓⠎⠞⠎-⠞⠊⠞⠓~⠊⠎⠞⠓⠊⠎└┐  PYSERIAL GUIDE  ⠞⠊⠓⠊::::::⠞⠓⠊⠎,⠞⠊.⠞⠓⠊⠎i⠞⠓.⠊⠎⠞⠓⠊⠎
    ø------------+--------------------------------------------------------------------ø
    
    # BASIC SERIALIZATION TESTING
    
        Test a FastAPI application for serialization vulnerabilities:

        $ vimana run pyserial --target-url http://127.0.0.1:8000

    ø---------------------------------------------------------------------------------ø
    
        Use an existing API specification from jcolt:
    
        $ vimana run pyserial --apispec aS8238

    ø---------------------------------------------------------------------------------ø
    
        Export results to JSON for CI/CD integration:

        $ vimana run pyserial --apispec aS8238 --json
        
        # Custom JSON output filename:
        $ vimana run pyserial --apispec aS8238 --output security_report.json

    ø---------------------------------------------------------------------------------ø
    
    # TARGETED SERIALIZATION TESTING
    
        Test specific serialization categories:

        $ vimana run pyserial --apispec aS8238 --test-type depth_testing,binary_data
        
        # Focus on pickle deserialization vulnerabilities:
        $ vimana run pyserial --target-url http://api.example.com --test-type binary_data --json

    ø---------------------------------------------------------------------------------ø
    
        Test specific Pydantic models:

        $ vimana run pyserial --apispec aS8238 --pydantic-models UserModel,ProductModel
        
        # With JSON export:
        $ vimana run pyserial --target-url http://api.example.com \
          --pydantic-models UserModel,AuthModel \
          --output model_security_tests.json

    ø---------------------------------------------------------------------------------ø
    
    # CUSTOM SERIALIZATION TESTS
    
        Use custom test vectors from a file:

        $ vimana run pyserial --apispec aS8238 --custom-test tests/custom_vectors.yaml
        
        # Use custom tests from a directory:
        $ vimana run pyserial --target-url http://api.example.com --custom-test tests/custom/

    ø---------------------------------------------------------------------------------ø
    
        Enable interactive payload builder for manual exploitation:

        $ vimana run pyserial --apispec aS8238 --set-custom-payload
        
        # With specific test categories:
        $ vimana run pyserial --target-url http://api.example.com \
          --test-type binary_data,circular_references \
          --set-custom-payload

    ø---------------------------------------------------------------------------------ø
    
    # CI/CD INTEGRATION
    
        Basic CI/CD security check with JSON export:

        $ vimana run pyserial --apispec aS8238 --output security-scan.json
        
        # Focused vulnerability testing for pipelines:
        $ vimana run pyserial --target-url $API_URL \
          --test-type binary_data,type_confusion \
          --output vuln-check.json

    ø---------------------------------------------------------------------------------ø
    
        Comprehensive testing with all features:

        $ vimana run pyserial --target-url http://api.example.com \
          --test-type depth_testing,type_confusion,binary_data \
          --custom-test tests/custom/ \
          --set-custom-payload \
          --output comprehensive_security_report.json \
          --navigation-mode

    ø---------------------------------------------------------------------------------ø
    
    # INTEGRATION WITH JCOLT
    
        Use jcolt to scan and then test with pyserial:

        $ vimana run jcolt --scan-api http://api.example.com
        $ vimana run pyserial --apispec aS8238 --json
        
        # Or let jcolt orchestrate serialization testing (scan the latest API):
        $ vimana run jcolt --serialization-test --json

    ø---------------------------------------------------------------------------------ø
    
    # GITHUB ACTIONS EXAMPLE
    
        Basic GitHub Actions workflow for PySerial security testing:
        
        name: PySerial Security Scan
        on:
          push:
            branches: [ main ]
          pull_request:
            branches: [ main ]
        
        jobs:
          serialization-security:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              
              - name: Setup Python
                uses: actions/setup-python@v5
                with:
                  python-version: '3.10'
              
              - name: Install Vimana
                run: |
                  curl -s https://raw.githubusercontent.com/s4dhulabs/vimana-framework/develop/scripts/install | bash
                  export PATH="$HOME/.local/bin:$PATH"
                  source $HOME/.local/bin/env || true
              
              - name: Start Test API
                run: |
                  pip install fastapi uvicorn
                  uvicorn test_app:app --host 0.0.0.0 --port 8000 &
                  sleep 5
              
              - name: Run PySerial Security Tests
                run: |
                  cd ~/vimana-framework && source .venv/bin/activate  
                  vf run pyserial --target-url http://localhost:8000 --output pyserial_security_report.json
              
              - name: Upload Security Report
                uses: actions/upload-artifact@v4
                with:
                  name: pyserial-security-report
                  path: pyserial_security-report.json

