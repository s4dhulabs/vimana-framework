  parse_plugin_scope: False
guide:
  naviargs: 
    target_url: True
    apispec_enabled: True
  args: |
    ø---------------------------------------------------------------------------------ø
    │└┐└│└┘┌┐│└└┘┌┐┘└┘└┐└┘└┘└┘└┘│└┐┘││ PYSERIAL ARGS ┐│││└┐└┘┘└┘││├┤┘│││┤└└│└┘┘││└└┘└┘┐
    ø------------+--------------------------------------------------------------------ø
    │ Target    └┐                                                                    │ 
    +------------+--------------------------------------------------------------------+
     --target-url        Target URL for serialization testing
     --apispec           Use API specification by ID (from jcolt scan)
     --oas               Alias for --apispec
    +-----------+---------------------------------------------------------------------+
    │ Test Types└┐                                                                    │     
    +------------+--------------------------------------------------------------------+
     --test-type         Specify serialization test categories (comma-separated):
                           * depth_testing: Tests for recursive depth limits
                           * type_confusion: Tests for serialization type issues
                           * binary_data: Tests with binary/encoded data
                           * circular_references: Tests with circular references
                           * large_nested_structures: Tests with large nested data
                           * special_characters: Tests with problematic characters
                           * custom: Application-specific serialization tests
                           Note: All categories run by default if not specified
    +-----------+---------------------------------------------------------------------+
    │ Models    └┐                                                                    │
    +------------+--------------------------------------------------------------------+
     --pydantic-models   Target specific Pydantic models (comma-separated)
                         If not specified, all models from spec are tested
    +-----------+---------------------------------------------------------------------+
    │ Custom    └┐                                                                    │
    +------------+--------------------------------------------------------------------+
     --custom-test       Path to custom serialization test file or directory
                         Supports YAML/JSON format with test vectors
                         Examples:
                           • File: --custom-test tests/deep_recursion.yaml
                           • Directory: --custom-test tests/custom/
     --set-custom-payload Enable interactive payload builder after finding
                         exploitable vectors. Launches interactive mode for
                         manual payload crafting and exploitation testing
    +-----------+---------------------------------------------------------------------+
    │ Output    └┐                                                                    │      
    +------------+--------------------------------------------------------------------+
     --json              Enable JSON export for CI/CD integration
                         Generates structured JSON report with complete test data
                         Auto-generates filename: pyserial_tests_{timestamp}.json
     --output            Custom output filename for JSON export
                         Example: --output my_serialization_report.json
                         Note: When using --output, --json is implied by .json extension
     --export-format     Export format (json, html, csv, pdf) [LEGACY]
                         Note: Use --json or --output for modern CI/CD integration
     --navigation-mode   Enable interactive navigation of results
     --verbose           Enable verbose output (default: true)
     --no-color          Disable colored output

     * For examples: `vimana guide -m pyserial -e`              
  examples: |
