name: PySerial
author: s4dhu <s4dhul4bs[at]prontonmail[dot]ch
brief: Python Serialization Security Testing Plugin
category: Audit
framework: Python
info: Specialized tool for testing serialization vulnerabilities in Python applications
module: siddhis/pyserial/pyserial.py 
package: Python
type: DAST
astt: DAST
tags:
  - Serialization
  - Deserialization
  - Security Testing
  - Pydantic
  - FastAPI
  - Python
composition: 
  mode: Standalone
description: |
  PySerial is a specialized security testing plugin focused exclusively on identifying
  serialization and deserialization vulnerabilities in Python applications, particularly
  those using FastAPI and Pydantic models.
  
  Key features include:
  - Comprehensive serialization vulnerability testing with multiple attack vectors
  - Deep analysis of Pydantic model serialization behavior
  - Custom payload generation for various serialization attack scenarios
  - Interactive payload builder for manual testing and exploitation
  - Support for multiple serialization test categories:
    * Depth testing - Tests for recursive depth limits and stack overflow
    * Type confusion - Tests for serialization type coercion vulnerabilities
    * Binary data - Tests with binary/encoded data including pickle deserialization
    * Circular references - Tests with circular reference handling
    * Large nested structures - Tests with memory exhaustion scenarios
    * Special characters - Tests with problematic Unicode and control characters
    * Custom tests - Application-specific serialization test vectors
  
  - Advanced vulnerability detection for:
    * Unsafe pickle deserialization (RCE potential)
    * JSON depth limit bypasses (DoS potential)
    * Type confusion in serialization (Data corruption)
    * Memory exhaustion through large payloads (DoS potential)
    * Unicode normalization attacks
    * Circular reference infinite loops
  
  - Comprehensive reporting with detailed vulnerability analysis
  - Integration with existing API specifications from jcolt
  - Automatic fallback to the latest scanned API spec (ENV_FALLBACK_SPEC_ID) if --apispec is not provided, enabling seamless workflows after a jcolt scan
  - Support for custom test vectors via YAML/JSON configuration
  - Interactive navigation system for exploring test results
  - Multiple export formats (JSON, HTML, CSV, PDF)
  - Structured JSON export for CI/CD integration with complete test reproducibility
  
  PySerial can be used standalone or as part of a comprehensive API security testing
  pipeline, integrating seamlessly with jcolt for complete FastAPI security assessment.
  
references:
  links:
    - https://owasp.org/www-community/vulnerabilities/Deserialization_of_untrusted_data
    - https://portswigger.net/web-security/deserialization
    - https://docs.python.org/3/library/pickle.html#pickle-security
    - https://pydantic-docs.helpmanual.io/usage/serialization/
  cwe:
    - CWE-502 - Deserialization of Untrusted Data
    - CWE-20 - Improper Input Validation
    - CWE-400 - Uncontrolled Resource Consumption
    - CWE-674 - Uncontrolled Recursion
    - CWE-787 - Out-of-bounds Write
    - CWE-190 - Integer Overflow or Wraparound
    - CWE-1288 - Improper Validation of Consistency within Input
