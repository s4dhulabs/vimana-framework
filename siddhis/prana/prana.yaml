name: Prana
author: s4dhu <s4dhul4bs[at]prontonmail[dot]ch
brief: Tracks CVE IDs for Python web frameworks (Django, Flask, FastAPI, etc.)
category: Framework
framework: Python
info: Utility to retrieve CVE IDs for Python web frameworks (Django, Flask, FastAPI, Pyramid, Bottle, etc.)
module: siddhis/prana/prana.py
package: Python Web Frameworks
type: Tracker
astt: DAST
tags:
  - Django
  - Flask
  - FastAPI
  - Pyramid
  - Bottle
  - Security
  - CVE
description: |
  Prana is a unified utility to retrieve CVE IDs from the OSV
  (Open Source Vulnerabilities) database for Python web
  frameworks such as Django, Flask, FastAPI, Pyramid, Bottle,
  and more. It receives a framework name and version as
  arguments and retrieves related CVEs. Prana is used as a
  resource by other Vimana modules (e.g., Framewalk, DMT) to
  correlate the identified framework version with the
  respective CVEs. It uses a smart local cache and only
  queries the OSV API if needed.
references:
  links:
    - https://osv.dev/
    - https://www.djangoproject.com/
    - https://flask.palletsprojects.com/
    - https://fastapi.tiangolo.com/
  cwe: False
vfset:
  parse_plugin_scope: False
guide:
  args: |
    ø--------------------------------------------------------------------------------ø
    │ PRANA ARGS                                                                     │
    ø-----------+--------------------------------------------------------------------ø
    │ scope     └┐                                                                   │
    +------------+-------------------------------------------------------------------+
     --framework           Framework to look for issues (e.g. django, flask, fastapi)
     --framework-version   Framework version to look for issues (e.g. 1.8, 2.0, 3.1)

  examples: |
    ø--------------------------------------------------------------------------------ø
    │ PRANA GUIDE                                                                    │
    ø--------------------------------------------------------------------------------ø
        Start prana looking for Django 1.8 issues:
        $ vimana run -m prana --framework django --framework-version 1.8

        Start prana looking for Flask 3.0 issues:
        $ vimana run -m prana --framework flask --framework-version 3.0

        * Note: Prana is now the unified CVE provider for all Vimana plugins.
        * To perform passive fingerprinting of a running application, use Framewalk:
          $ vimana run -m framewalk --target http://example.com

  lab_setup: |
    ø--------------------------------------------------------------------------------ø
    │ PRANA SETUP                                                                    │  
    ø--------------------------------------------------------------------------------ø

        You can see lab examples with:
        $ vimana guide -m dmt -l

